plugins {
    id "com.gradleup.shadow" version "9.4.1"
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        client {
            property 'mixin.debug', 'true'
        }
    }
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.neoforged.net/releases/" }
}

dependencies {
    modules {
        module("com.google.guava:listenablefuture") {
            replacedBy("com.google.guava:guava", "listenablefuture is part of guava")
        }
    }
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}", {
        exclude module: 'guava'
    }

    common(project(path: ":common", configuration: "default")) { transitive = false }
    shadowCommon(project(path: ":common", configuration: "default")) { transitive = false }
}

processResources {
    def modVersion = project.version.toString()
    inputs.property "version", modVersion

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": modVersion
    }
}

shadowJar {
    exclude "fabric.mod.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("NeoForge-${rootProject.minecraft_version}")
    from rootProject.file("LICENSE.txt")
}

jar {
    archiveClassifier.set("dev")
}

java {
    withSourcesJar()
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from commonSources.archiveFile.map { zipTree(it) }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

unifiedPublishing {
    project {
        displayName.set("BetterF3 NeoForge v${project.version} (${project.supported_minecraft_versions})")
        version = project.version
        changelog = releaseChangelog()
        releaseType.set(project.releaseType)
        List<String> mcVersions = project.supported_minecraft_versions_list.split(",")
        gameVersions.set(mcVersions)
        gameLoaders = ["neoforge"]

        mainPublication(tasks.shadowJar)

        relations {
            depends {
                curseforge.set "cloth-config"
                modrinth.set "cloth-config"
            }
        }

        var CURSE_API_KEY = project.findProperty("CURSE_API_KEY") ?: System.getenv("CURSE_API_KEY")
        if (CURSE_API_KEY != null && CURSE_API_KEY instanceof String) {
            curseforge {
                token.set(CURSE_API_KEY)
                id = rootProject.curseforge_id
                gameVersions.addAll("Java 25")
            }
        }

        var MODRINTH_TOKEN = project.findProperty("MODRINTH_TOKEN") ?: System.getenv("MODRINTH_TOKEN")
        if (MODRINTH_TOKEN != null && MODRINTH_TOKEN instanceof String) {
            modrinth {
                token.set(MODRINTH_TOKEN)
                id = rootProject.modrinth_id
            }
        }
    }
}
